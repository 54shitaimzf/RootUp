[package]
name = "rootup"
version = "0.8.6"
description = "RootUp - 面向学生的智能文件整理工具"
authors = ["余烬"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "rootup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
bench = []

# 0.8.6 阶段二体积优化：lto/codegen=1/strip/panic=abort/opt-level=s
# （UPX 仅对照实验，不作为默认；性能影响由官方基线统一体现）
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[[bench]]
name = "engine_bench"
harness = false
required-features = ["bench"]

[[example]]
name = "scan_probe"
required-features = ["bench"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-opener = "2"
mslnk = "0.1.8"
winreg = "0.56.0"
aho-corasick = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }
