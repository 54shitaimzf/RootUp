name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你正在做什么，遇到了什么麻烦？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为、界面或交互方式
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 替代方案
      description: 其他可行做法（可选）
