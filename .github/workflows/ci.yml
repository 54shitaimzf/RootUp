name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'benchmarks/*.md'
      - 'benchmarks/charts/**'
      - 'benchmarks/results/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'benchmarks/*.md'
      - 'benchmarks/charts/**'
      - 'benchmarks/results/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Version consistency check
        run: npm run check:version

      - name: Frontend tests
        run: |
          npm test 2>&1 | Tee-Object -FilePath frontend-test.log
          exit $LASTEXITCODE

      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-output
          path: frontend-test.log
          if-no-files-found: ignore

      - name: Architecture check
        run: npm run check:arch

      - name: Rust architecture check
        run: npm run check:arch:rust

      - name: Frontend build
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: |
          cargo test 2>&1 | Tee-Object -FilePath test-output.log
          exit $LASTEXITCODE

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: src-tauri/test-output.log
          if-no-files-found: ignore

      - name: Release build (complete app)
        run: npm run tauri build -- --no-bundle

      - name: Stage artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "release-artifacts" -Force | Out-Null
          Copy-Item "src-tauri\target\release\rootup.exe" "release-artifacts\rootup.exe" -Force
          Copy-Item "dist" "release-artifacts\dist" -Recurse -Force

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootup-build
          path: release-artifacts
          if-no-files-found: error

  smoke:
    needs: ci
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rootup-build
          path: build-artifacts

      - name: Place build artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "src-tauri\target\release" -Force | Out-Null
          Copy-Item "build-artifacts\rootup.exe" "src-tauri\target\release\rootup.exe" -Force
          if (Test-Path "build-artifacts\dist") {
            if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
            Copy-Item "build-artifacts\dist" "dist" -Recurse
          }

      - name: Run smoke test
        shell: powershell
        run: scripts/smoke.ps1

      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-summary
          path: scripts/smoke-summary.log
          if-no-files-found: ignore
