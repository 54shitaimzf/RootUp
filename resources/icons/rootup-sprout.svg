  幼苗图形取自 lucide-react 的 Sprout 图标（ISC 许可），
  与界面侧边栏 Logo 使用同一图形数据，保证视觉一致。
  深色方块配白色描边，保证浅色/深色任务栏下都能快速辨识。
  此文件为源文件，托盘图标由它渲染为 PNG（rootup-sprout.png）。
-->
